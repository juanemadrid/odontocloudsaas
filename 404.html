<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OdontoCloud</title>
    <script>
      // SPA redirect fix for GitHub Pages
      // Redirige cualquier ruta 404 al index.html preservando la URL
      var segmentCount = 1; // Número de segmentos del base path (/odontocloud-react/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirigiendo...
  </body>
</html>
